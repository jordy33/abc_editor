<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YuE2 ABC Editor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <h1>YuE2 ABC Editor</h1>
    <span class="hint">Load, edit and save native YuE2 <code>.abc</code> scores — piano roll, chords, tempo, key.</span>
</header>
<main id="editor"></main>
<footer class="bottombar">
    <span>Two monophonic voices (<code>Vocal</code> / <code>Ins</code>) plus a chord lane. Scores save to this browser automatically; use <strong>Export ABC</strong> to write a file.</span>
</footer>
<script type="module" src="score_editor.js"></script>
</body>
</html>
